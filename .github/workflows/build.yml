name: Build BAKAL OCR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev lld
        pip install buildozer cython virtualenv

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'SPECEOF'
        [app]
        title = BAKAL OCR
        package.name = bakalocr
        package.domain = com.bakal
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 2.0
        requirements = python3,kivy==2.3.0,pillow,plyer,numpy,opencv-python-headless,pytesseract
        orientation = portrait
        android.permissions = CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.archs = arm64-v8a
        android.allow_backup = True
        fullscreen = 0

        [buildozer]
        log_level = 2
        warn_on_root = 1
        SPECEOF

    - name: Build APK
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BAKAL-OCR-APK
        path: bin/*.apk