name: Build BAKAL OCR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev lld
        pip install buildozer cython virtualenv

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android build tools
      run: |
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Create spec
      run: |
        printf '[app]\ntitle = BAKAL OCR\npackage.name = bakalocr\npackage.domain = com.bakal\nsource.dir = .\nsource.include_exts = py,png,jpg,kv,atlas\nversion = 2.0\nrequirements = python3,kivy==2.3.0,pillow,plyer,numpy,opencv-python-headless,pytesseract\norientation = portrait\nandroid.permissions = CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,INTERNET\nandroid.api = 33\nandroid.minapi = 21\nandroid.ndk = 25b\nandroid.archs = arm64-v8a\nfullscreen = 0\n\n[buildozer]\nlog_level = 2\nwarn_on_root = 1\n' > buildozer.spec

    - name: Build APK
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        buildozer android debug

    - uses: actions/upload-artifact@v4
      with:
        name: BAKAL-OCR-APK
        path: bin/*.apk